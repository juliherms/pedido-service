# Application Configuration
quarkus.application.name=pedidos-service
quarkus.application.version=1.0.0

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.test-port=8081

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."br.com.exemplo.orders".level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Jackson Configuration (JSON Serialization)
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false

# ===========================================
# Kafka Configuration (SmallRye Reactive Messaging)
# ===========================================

# Kafka Bootstrap Servers
kafka.bootstrap.servers=localhost:9092

# Outgoing Channel: orders-out -> Topic: orders.received
mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=orders.received
mp.messaging.outgoing.orders-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Key Serializer (String - orderId)
mp.messaging.outgoing.orders-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Producer Configuration - Garantias de entrega
# acks=all: garante que líder e réplicas confirmem
mp.messaging.outgoing.orders-out.acks=all

# enable.idempotence=true: evita duplicatas em retry
mp.messaging.outgoing.orders-out.enable.idempotence=true

# retries: número de tentativas em caso de falha transitória
mp.messaging.outgoing.orders-out.retries=3

# delivery.timeout.ms: timeout total para envio (incluindo retries)
# Default 120000ms (2min), ajustado para 30s
mp.messaging.outgoing.orders-out.delivery.timeout.ms=30000

# request.timeout.ms: timeout por request individual
mp.messaging.outgoing.orders-out.request.timeout.ms=10000

# max.in.flight.requests.per.connection: com idempotence=true, pode ser > 1
mp.messaging.outgoing.orders-out.max.in.flight.requests.per.connection=5

# Batching (opcional - melhora throughput, aumenta latência)
# linger.ms: aguarda até X ms antes de enviar batch (default 0)
# Ajustar conforme necessidade de latência vs throughput
mp.messaging.outgoing.orders-out.linger.ms=10

# batch.size: tamanho máximo do batch em bytes (default 16384)
mp.messaging.outgoing.orders-out.batch.size=16384

# compression.type: compressão (none, gzip, snappy, lz4, zstd)
mp.messaging.outgoing.orders-out.compression.type=snappy

# ===========================================
# SmallRye Health Configuration
# ===========================================
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready

# Kafka Health Check
# Verifica conexão com Kafka no readiness
quarkus.smallrye-health.check."kafka".enabled=true

# ===========================================
# Micrometer & Prometheus Configuration
# ===========================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# Registrar métricas customizadas
quarkus.micrometer.registry-enabled-default=true

# Binders - métricas automáticas
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-server.match-patterns=/api/*
quarkus.micrometer.binder.kafka.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.system.enabled=true

# Métricas HTTP incluem URI tags
quarkus.micrometer.binder.http-server.suppress-non-application-uris=false

# ===========================================
# Dev Services (Desenvolvimento Local)
# ===========================================
# Dev Services automaticamente sobe Kafka via Testcontainers em dev mode
# Desabilitar se usar docker-compose externo
%dev.quarkus.kafka.devservices.enabled=false
%dev.kafka.bootstrap.servers=localhost:9092

# Test profile com Dev Services habilitado (Testcontainers)
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.port=0
