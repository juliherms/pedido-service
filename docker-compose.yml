version: '3.8'

services:
  # ==================================================================
  # APLICAÇÃO QUARKUS - MS PEDIDOS API
  # ==================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-pedidos-api
    hostname: app
    ports:
      - "8080:8080"
    environment:
      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Logging
      QUARKUS_LOG_LEVEL: INFO
      # Metrics
      QUARKUS_MICROMETER_ENABLED: "true"
      QUARKUS_MICROMETER_EXPORT_PROMETHEUS_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - orders-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==================================================================
  # PROMETHEUS - Coleta e Armazenamento de Métricas
  # ==================================================================
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Arquivo de configuração
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Armazenamento de dados persistente
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # Retenção de dados (15 dias)
      - '--storage.tsdb.retention.time=15d'
      # Tamanho máximo de armazenamento (10GB)
      - '--storage.tsdb.retention.size=10GB'
      # Habilitar lifecycle API (reload via POST)
      - '--web.enable-lifecycle'
      # Habilitar admin API
      - '--web.enable-admin-api'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - orders-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==================================================================
  # GRAFANA - Visualização e Dashboards
  # ==================================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      # Configurações de Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Configurações gerais
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous access (útil para demo, remover em produção)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Timezone
      GF_DEFAULT_TIMEZONE: America/Sao_Paulo
    volumes:
      # Provisionamento automático de datasources
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Provisionamento automático de dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Dashboards JSON
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Dados persistentes do Grafana
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - orders-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==================================================================
  # KAFKA - Message Broker
  # ==================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    user: root
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - orders-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ==================================================================
  # KAFKA UI - Interface Web para Kafka
  # ==================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - orders-network
    restart: unless-stopped

  # ==================================================================
  # LOCUST - Load Testing
  # ==================================================================
  locust:
    build:
      context: ./locust
      dockerfile: Dockerfile
    container_name: locust
    hostname: locust
    ports:
      - "8089:8089"
    environment:
      LOCUST_HOST: http://app:8080
    volumes:
      - ./locust:/mnt/locust:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - orders-network
    restart: unless-stopped
    # Modo com UI (padrão) - Acesse http://localhost:8089
    command: >
      -f /mnt/locust/locustfile.py
      --web-host=0.0.0.0
      --web-port=8089
      --html=/mnt/locust/report.html
    # Para modo HEADLESS (automático) com 350 TPS por 30 minutos, descomente abaixo:
    # command: >
    #   -f /mnt/locust/locustfile.py
    #   --headless
    #   --users=120
    #   --spawn-rate=4
    #   --run-time=30m
    #   --host=http://app:8080
    #   --html=/mnt/locust/report.html

# ==================================================================
# VOLUMES PERSISTENTES
# ==================================================================
volumes:
  kafka-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ==================================================================
# NETWORK
# ==================================================================
networks:
  orders-network:
    driver: bridge
